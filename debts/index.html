<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schuldentracker – paulfunke.me</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div class="page">
    <header class="top">
      <h1>Schuldentracker</h1>
      <button class="secondary" id="logout-btn">Logout</button>
    </header>

    <div class="summary">
      <div class="card">
        <div class="value owed-to-me" id="total-owed-to-me">0,00 €</div>
        <div>bekomme ich</div>
      </div>
      <div class="card">
        <div class="value i-owe" id="total-i-owe">0,00 €</div>
        <div>schulde ich</div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Neuer Eintrag</h3>
      <form id="debt-form">
        <div class="direction-toggle">
          <label>
            <input type="radio" name="direction" value="owed_to_me" checked />
            Person schuldet mir
          </label>
          <label>
            <input type="radio" name="direction" value="i_owe" />
            Ich schulde Person
          </label>
        </div>

        <label for="person">Name der Person</label>
        <input type="text" id="person" required />

        <label for="amount">Betrag (€)</label>
        <input type="number" id="amount" step="0.01" min="0.01" required />

        <label for="reason">Wofür?</label>
        <input type="text" id="reason" placeholder="z.B. Pizza, Konzertticket..." />

        <label>Beleg (optional)</label>
        <div class="receipt-picker">
          <button type="button" class="secondary" id="add-photo-btn">📎 Foto hinzufügen</button>
        </div>
        <input type="file" id="file-input" accept="image/*" class="hidden" />
        <div id="receipt-preview-wrap" class="receipt-preview-wrap hidden">
          <img id="receipt-preview" class="receipt-preview" alt="Beleg-Vorschau" />
          <button type="button" class="secondary" id="remove-photo-btn">Entfernen</button>
        </div>

        <div class="btn-row">
          <button type="submit">Hinzufügen</button>
        </div>
        <div class="error-msg" id="error-msg"></div>
      </form>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Übersicht</h3>

      <div class="filter-bar">
        <input type="text" id="filter-person" placeholder="Nach Person suchen..." />
        <div class="filter-row">
          <div>
            <label for="filter-min">Betrag min (€)</label>
            <input type="number" id="filter-min" step="0.01" min="0" placeholder="0" />
          </div>
          <div>
            <label for="filter-max">Betrag max (€)</label>
            <input type="number" id="filter-max" step="0.01" min="0" placeholder="∞" />
          </div>
        </div>
        <label for="filter-receipt">Beleg</label>
        <select id="filter-receipt">
          <option value="all">Alle</option>
          <option value="with">Nur mit Beleg</option>
          <option value="without">Nur ohne Beleg</option>
        </select>
        <div class="btn-row">
          <button type="button" class="secondary" id="filter-reset-btn">Filter zurücksetzen</button>
        </div>
      </div>

      <div id="debt-list"></div>
    </div>
  </div>

  <div id="detail-overlay" class="overlay hidden">
    <div class="overlay-card card">
      <button type="button" class="secondary overlay-close" id="detail-close-btn">✕</button>
      <h3 id="detail-name" style="margin-top:0"></h3>
      <div id="detail-amount" class="detail-amount"></div>
      <div id="detail-reason" class="detail-reason"></div>
      <div id="detail-status" class="detail-status"></div>
      <div id="detail-receipt-wrap" class="hidden">
        <label>Beleg</label>
        <img id="detail-receipt-img" class="receipt-preview" alt="Beleg" />
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@27.0.0"></script>
  <script src="/assets/js/appwrite-config.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    const DATABASE_ID = "main";
    const TABLE_ID = "debts";
    const RECEIPTS_BUCKET_ID = "receipts";

    let currentUser = null;
    let debts = [];
    let selectedReceiptFile = null;

    const fmt = (n) => n.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";

    async function init() {
      currentUser = await requireLogin("/login/?redirect=/debts/");
      if (!currentUser) return;
      await loadDebts();
    }

    async function loadDebts() {
      const res = await tablesDB.listRows({
        databaseId: DATABASE_ID,
        tableId: TABLE_ID,
        queries: [Appwrite.Query.orderDesc("$createdAt"), Appwrite.Query.limit(100)],
      });
      debts = res.rows;
      render();
    }

    function getFilteredDebts() {
      const personQuery = document.getElementById("filter-person").value.trim().toLowerCase();
      const min = parseFloat(document.getElementById("filter-min").value);
      const max = parseFloat(document.getElementById("filter-max").value);
      const receiptFilter = document.getElementById("filter-receipt").value;

      return debts.filter((debt) => {
        if (personQuery && !debt.person.toLowerCase().includes(personQuery)) return false;
        if (!isNaN(min) && debt.amount < min) return false;
        if (!isNaN(max) && debt.amount > max) return false;
        if (receiptFilter === "with" && !debt.receiptFileId) return false;
        if (receiptFilter === "without" && debt.receiptFileId) return false;
        return true;
      });
    }

    function render() {
      const list = document.getElementById("debt-list");
      list.innerHTML = "";

      const filteredDebts = getFilteredDebts();

      if (debts.length === 0) {
        list.innerHTML = '<div class="empty-state">Noch keine Einträge.</div>';
      } else if (filteredDebts.length === 0) {
        list.innerHTML = '<div class="empty-state">Keine Einträge passen zu diesem Filter.</div>';
      }

      let owedToMe = 0;
      let iOwe = 0;

      for (const debt of filteredDebts) {
        if (!debt.settled) {
          if (debt.direction === "owed_to_me") owedToMe += debt.amount;
          else iOwe += debt.amount;
        }

        const item = document.createElement("div");
        item.className = "debt-item" + (debt.settled ? " settled" : "");
        item.dataset.id = debt.$id;

        const sign = debt.direction === "owed_to_me" ? "+" : "−";
        const colorClass = debt.direction === "owed_to_me" ? "owed-to-me" : "i-owe";
        const receiptBadge = debt.receiptFileId ? '<span class="receipt-badge">📎</span>' : "";

        item.innerHTML = `
          <div class="debt-info">
            <div class="name">${escapeHtml(debt.person)} ${receiptBadge}</div>
            <div class="reason">${escapeHtml(debt.reason || "")}</div>
          </div>
          <div class="debt-amount ${colorClass}">${sign} ${fmt(debt.amount)}</div>
          <div class="debt-actions">
            <button class="secondary settle-btn" data-id="${debt.$id}">${debt.settled ? "Zurück" : "Beglichen"}</button>
            <button class="danger delete-btn" data-id="${debt.$id}">✕</button>
          </div>
        `;
        list.appendChild(item);
      }

      document.getElementById("total-owed-to-me").textContent = fmt(owedToMe);
      document.getElementById("total-i-owe").textContent = fmt(iOwe);

      list.querySelectorAll(".debt-info").forEach((el) => {
        el.addEventListener("click", () => openDetail(el.closest(".debt-item").dataset.id));
      });
      list.querySelectorAll(".settle-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => { e.stopPropagation(); toggleSettled(btn.dataset.id); });
      });
      list.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => { e.stopPropagation(); deleteDebt(btn.dataset.id); });
      });
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    async function toggleSettled(id) {
      const debt = debts.find((d) => d.$id === id);
      await tablesDB.updateRow({
        databaseId: DATABASE_ID,
        tableId: TABLE_ID,
        rowId: id,
        data: { settled: !debt.settled },
      });
      await loadDebts();
    }

    async function deleteDebt(id) {
      if (!confirm("Diesen Eintrag wirklich löschen?")) return;
      const debt = debts.find((d) => d.$id === id);
      if (debt && debt.receiptFileId) {
        await storage.deleteFile({ bucketId: RECEIPTS_BUCKET_ID, fileId: debt.receiptFileId }).catch(() => {});
      }
      await tablesDB.deleteRow({ databaseId: DATABASE_ID, tableId: TABLE_ID, rowId: id });
      await loadDebts();
    }

    const fileInput = document.getElementById("file-input");
    const previewWrap = document.getElementById("receipt-preview-wrap");
    const previewImg = document.getElementById("receipt-preview");

    document.getElementById("add-photo-btn").addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;
      selectedReceiptFile = file;
      previewImg.src = URL.createObjectURL(file);
      previewWrap.classList.remove("hidden");
    });

    document.getElementById("remove-photo-btn").addEventListener("click", () => {
      selectedReceiptFile = null;
      fileInput.value = "";
      previewWrap.classList.add("hidden");
    });

    document.getElementById("debt-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById("error-msg");
      errorMsg.textContent = "";

      const direction = document.querySelector('input[name="direction"]:checked').value;
      const person = document.getElementById("person").value.trim();
      const amount = parseFloat(document.getElementById("amount").value);
      const reason = document.getElementById("reason").value.trim();

      const ownerPermissions = [
        Appwrite.Permission.read(Appwrite.Role.user(currentUser.$id)),
        Appwrite.Permission.update(Appwrite.Role.user(currentUser.$id)),
        Appwrite.Permission.delete(Appwrite.Role.user(currentUser.$id)),
      ];

      try {
        let receiptFileId = null;
        if (selectedReceiptFile) {
          const uploaded = await storage.createFile({
            bucketId: RECEIPTS_BUCKET_ID,
            fileId: Appwrite.ID.unique(),
            file: selectedReceiptFile,
            permissions: ownerPermissions,
          });
          receiptFileId = uploaded.$id;
        }

        await tablesDB.createRow({
          databaseId: DATABASE_ID,
          tableId: TABLE_ID,
          rowId: Appwrite.ID.unique(),
          data: { person, amount, reason, direction, settled: false, receiptFileId },
          permissions: ownerPermissions,
        });
        e.target.reset();
        selectedReceiptFile = null;
        previewWrap.classList.add("hidden");
        await loadDebts();
      } catch (err) {
        errorMsg.textContent = err.message || "Speichern fehlgeschlagen.";
      }
    });

    function openDetail(id) {
      const debt = debts.find((d) => d.$id === id);
      if (!debt) return;

      const sign = debt.direction === "owed_to_me" ? "+" : "−";
      const colorClass = debt.direction === "owed_to_me" ? "owed-to-me" : "i-owe";

      document.getElementById("detail-name").textContent = debt.person;
      const amountEl = document.getElementById("detail-amount");
      amountEl.textContent = `${sign} ${fmt(debt.amount)}`;
      amountEl.className = `detail-amount ${colorClass}`;
      document.getElementById("detail-reason").textContent = debt.reason || "";
      document.getElementById("detail-status").textContent = debt.settled ? "Beglichen" : "Offen";

      const receiptWrap = document.getElementById("detail-receipt-wrap");
      if (debt.receiptFileId) {
        const url = storage.getFileView({ bucketId: RECEIPTS_BUCKET_ID, fileId: debt.receiptFileId });
        document.getElementById("detail-receipt-img").src = url;
        receiptWrap.classList.remove("hidden");
      } else {
        receiptWrap.classList.add("hidden");
      }

      document.getElementById("detail-overlay").classList.remove("hidden");
    }

    function closeDetail() {
      document.getElementById("detail-overlay").classList.add("hidden");
    }

    document.getElementById("detail-close-btn").addEventListener("click", closeDetail);
    document.getElementById("detail-overlay").addEventListener("click", (e) => {
      if (e.target.id === "detail-overlay") closeDetail();
    });

    document.getElementById("logout-btn").addEventListener("click", logout);

    ["filter-person", "filter-min", "filter-max", "filter-receipt"].forEach((id) => {
      document.getElementById(id).addEventListener("input", render);
    });

    document.getElementById("filter-reset-btn").addEventListener("click", () => {
      document.getElementById("filter-person").value = "";
      document.getElementById("filter-min").value = "";
      document.getElementById("filter-max").value = "";
      document.getElementById("filter-receipt").value = "all";
      render();
    });

    init();
  </script>
</body>
</html>
